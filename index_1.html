<title>Catan Calc</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;color:#eee;font-family:-apple-system,sans-serif;display:flex;justify-content:center;padding:16px;}
.app{width:100%;max-width:360px;}
.header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.header img{width:40px;height:40px;border-radius:9px;}
h1{font-size:22px;}
.hist-box{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:8px 12px;margin-bottom:12px;min-height:190px;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a4a;font-size:18px;min-height:42px;}
.hist-row:last-child{border-bottom:none;}
.hist-row.current{color:#5ba4f5;}
.hist-row.placeholder{color:#555;font-size:13px;}
.del-btn{background:none;border:none;color:#555;font-size:16px;cursor:pointer;padding:4px 8px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.key{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.key:active{background:#2a2a4e;transform:scale(0.96);}
.key.empty{background:transparent;border:none;cursor:default;}
.num{font-size:20px;font-weight:500;color:#ddd;}
.num.hot{color:#e06040;}
.num.warm{color:#c8952a;}
.num.neutral{color:#555;}
.dots{font-size:11px;color:#c0392b;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.act-btn{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;height:48px;font-size:16px;color:#ddd;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.act-btn.danger{color:#e05050;border-color:#5a2020;}
.act-btn:active{background:#2a2a4e;}
</style>
</head>

  </div>
  <div class="hist-box" id="histBox"></div>
  <div class="keypad" id="keypad"></div>
  <div class="actions">
    <button class="act-btn" onclick="clearCurrent()">クリア</button>
    <button class="act-btn danger" onclick="clearAll()">AC</button>
  </div>
</div>
<script>
var DOTS={0:0,2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
var HOT=[6,8],WARM=[5,9,4,10];
var LAYOUT=[2,3,4,5,6,8,9,10,11,12,null,null,null,null,0];
var hist=[],cur=[];
function dotStr(n){return n===0?"—":"●".repeat(DOTS[n]||0);}
function numClass(n){if(HOT.indexOf(n)>=0)return "hot";if(WARM.indexOf(n)>=0)return "warm";if(n===0)return "neutral";return "";}
function render(){
  var box=document.getElementById("histBox");
  box.innerHTML="";
  for(var i=0;i<5;i++){
    var row=document.createElement("div");
    if(i<hist.length){
      var e=hist[i];
      var total=0;for(var j=0;j<e.length;j++)total+=DOTS[e[j]]||0;
      row.className="hist-row";
      row.innerHTML="<span>"+e.join(" + ")+" = "+total+"</span><button class='del-btn' onclick='delHist("+i+")'>&#x2715;</button>";
    }else if(i===hist.length&&hist.length<5){
      if(cur.length>0){
        var t=0;for(var k=0;k<cur.length;k++)t+=DOTS[cur[k]]||0;
        row.className="hist-row current";
        row.innerHTML="<span>"+cur.join(" + ")+" = "+t+"</span>";
      }else{
        row.className="hist-row placeholder";
        row.innerHTML="<span>&#8592; &#25968;&#23383;&#12434;&#36984;&#12435;&#12391;&#12367;&#12384;&#12373;&#12356;</span>";
      }
    }else{
      row.className="hist-row";
      row.innerHTML="<span>&nbsp;</span>";
    }
    box.appendChild(row);
  }
  var kp=document.getElementById("keypad");
  kp.innerHTML="";
  for(var i=0;i<LAYOUT.length;i++){
    var n=LAYOUT[i];
    var div=document.createElement("div");
    if(n===null){
      div.className="key empty";
    }else{
      div.className="key";
      div.innerHTML="<span class='num "+numClass(n)+"'>"+n+"</span><span class='dots'>"+dotStr(n)+"</span>";
      (function(num){div.onclick=function(){pressKey(num);};})(n);
    }
    kp.appendChild(div);
  }
}
function pressKey(n){
  if(hist.length>=5)return;
  cur.push(n);
  if(cur.length>=3){hist.unshift(cur.slice());if(hist.length>5)hist.pop();cur=[];}
  render();
}
function delHist(i){hist.splice(i,1);render();}
function clearCurrent(){cur=[];render();}
function clearAll(){hist=[];cur=[];render();}
window.onload=function(){render();};
</script>
